version: v1.0
name: release
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: release
    task:
      secrets:
        - name: rubygems-deploy
      jobs:
        - name: gem push
          commands:
            - checkout --use-cache
            - sem-version ruby 4.0 -f
            - VERSION=$(ruby -e "puts Gem::Specification.load('sqlite_shards.gemspec').version")
            - test "$VERSION" = "$SEMAPHORE_GIT_TAG_NAME"
            - gem build sqlite_shards.gemspec
            - gem push sqlite_shards-$VERSION.gem
